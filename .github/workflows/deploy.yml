name: Deploy to GitHub Pages

# Build the Vite app and publish it to GitHub Pages on every push to the
# default branch. In the repo, set Settings -> Pages -> Source to
# "GitHub Actions" (the create step in the README/setup does this for you).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # User/org sites (<login>.github.io) serve from root "/"; project
        # sites serve from "/<repo-name>/". Pick the right base accordingly.
        run: |
          name="${{ github.event.repository.name }}"
          if [[ "$name" == *.github.io ]]; then
            export VITE_BASE=/
          else
            export VITE_BASE=/$name/
          fi
          echo "Building with base: $VITE_BASE"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
