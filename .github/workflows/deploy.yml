name: Deploy

# One pipeline, one origin. Builds the site, tests the aggregation logic, applies
# any new D1 migrations, then deploys the Worker with the built site attached as
# static assets. The game, the dashboard page and the API all end up on the same
# hostname.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, plus D1: Edit
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard, right-hand sidebar
#
# DASHBOARD_KEY is a Worker secret, not a repository one. Set it once from your
# machine with `wrangler secret put DASHBOARD_KEY`; it survives deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Validate the scene graph
        # A dangling `next` renders a blank screen with no error, so this gates
        # the deploy rather than being a thing someone remembers to run.
        run: node scripts/validate-scenes.mjs

      - name: Build the site
        # Served from the Worker root, so base is "/". The analytics endpoints are
        # same-origin relative paths — no secret needed, nothing to keep in sync,
        # and no CORS. The dashboard *key* is never built in; the page asks for it.
        env:
          VITE_BASE: /
          VITE_ANALYTICS_URL: /collect
          VITE_DASHBOARD_URL: /dashboard.json
        run: npm run build

      - name: Install worker dependencies
        working-directory: worker
        run: npm install

      - name: Test aggregation logic
        # Metric definitions are the one thing that cannot be fixed after the
        # fact: once raw events are purged, a wrong definition is a wrong number
        # forever.
        working-directory: worker
        run: npm test

      - name: Apply D1 migrations
        # Before deploy: new code must never meet an old schema. Additive
        # (CREATE TABLE IF NOT EXISTS), so re-running is a no-op.
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply safesteps --remote

      - name: Deploy worker and site
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          url="${{ vars.SITE_URL }}"
          if [ -z "$url" ]; then
            echo "SITE_URL repository variable not set — skipping smoke test."
            exit 0
          fi
          fail=0
          for path in /health / /dashboard/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
